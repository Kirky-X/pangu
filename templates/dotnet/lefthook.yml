# lefthook 配置。启用: brew install lefthook && lefthook install
# 与 .pre-commit-config.yaml 功能等价（含 pre-push 慢检查），二选一即可。
# diff coverage 依赖 uvx（uv 自带）：未装 uv 可 pip install diff-cover 后把 uvx diff-cover 改为 diff-cover。
# 工具缺失时的处置见 SKILL.md「常见失败处置」表（注释对应 hook，CI 兜底）。
pre-commit:
  parallel: true
  commands:
    dotnet-format:
      glob: "*.cs"
      run: dotnet format --verify-no-changes --severity warn
    dotnet-vulnerable:
      run: dotnet list package --vulnerable --include-transitive
    no-private-key:
      run: "! git diff --cached --name-only -z | xargs -0 -r grep -IlE 'BEGIN ((RSA|DSA|EC|OPENSSH|PGP) )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'test "$(grep -cE ''^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'' "$1")" = 1'

pre-push:
  commands:
    coverage:
      name: coverage ≥__PANGU_COV__% (global + diff)
      run: |
        dotnet test --collect:"XPlat Code Coverage"
        REPORTPATH="$(find . -path '*/coverage.cobertura.xml' | head -1)"
        [ -n "$REPORTPATH" ] || { echo "未找到 cobertura 报告"; exit 1; }
        command -v reportgenerator >/dev/null 2>&1 || dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:"$REPORTPATH" -targetdir:coverage-report -reporttypes:Cobertura
        LINERATE=$(grep -oE 'line-rate="[0-9.]+"' coverage-report/Cobertura.xml | head -1 | grep -oE '[0-9.]+')
        awk -v r="$LINERATE" -v t="__PANGU_COV__" 'BEGIN{ exit (r*100 >= t+0) ? 0 : 1 }'
        uvx diff-cover coverage-report/Cobertura.xml --fail-under __PANGU_COV__ --compare-branch "origin/__PANGU_BRANCH__"
