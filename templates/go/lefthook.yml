# lefthook 配置。启用: brew install lefthook && lefthook install
# 与 .pre-commit-config.yaml 功能等价（含 pre-push 慢检查），二选一即可。
# 工具缺失时的处置见 SKILL.md「常见失败处置」表（注释对应 hook，CI 兜底）。
# 已知限制：diff-cover 不支持 go 原生 coverprofile（见 references/coverage-standards.md），pre-push 仅全局门禁。
pre-commit:
  parallel: true
  commands:
    gofmt:
      run: 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
    go-vet:
      run: go vet ./...
    golangci-lint:
      run: golangci-lint run
    govulncheck:
      run: govulncheck ./...
    go-mod-tidy:
      run: go mod tidy && git diff --exit-code go.mod go.sum
    no-private-key:
      run: "! git diff --cached --name-only -z | xargs -0 -r grep -IlE 'BEGIN ((RSA|DSA|EC|OPENSSH|PGP) )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'test "$(grep -cE ''^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'' "$1")" = 1'

pre-push:
  commands:
    coverage:
      name: coverage ≥__PANGU_COV__% (global；go 暂无 diff coverage 标准工具)
      run: |
        go test -race -coverprofile=coverage.out -covermode=atomic ./...
        cov=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}')
        awk -v c="${cov%\%}" 'BEGIN{exit !(c+0 < __PANGU_COV__)}' && { echo "coverage $cov < __PANGU_COV__%"; exit 1; }
