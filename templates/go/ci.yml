name: CI
on:
  push:
    branches: [__PANGU_BRANCH__]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality (gofmt + vet + golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          [ -z "$out" ] || { echo "::error::gofmt failed:"; echo "$out"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60
  test:
    name: Test + Coverage (global ≥)
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Test with race + coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          cov=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}')
          echo "Total line coverage: $cov"
          # 覆盖率门禁：<阈值即失败（不以 || true 中和——静默失效违反规则12）
          awk -v c="${cov%\%}" 'BEGIN{exit !(c+0 < __PANGU_COV__)}' && \
            { echo "::error::Coverage $cov < __PANGU_COV__%"; exit 1; }
      # 已知限制：diff-cover 不支持 go 原生 coverprofile 格式（仅 Cobertura/Clover/JaCoCo XML/LCov），
      # Go 暂只有全局门禁；需要 diff coverage 时可用 gocov 转换后接 diff-cover，
      # 见 references/coverage-standards.md「diff coverage」节
      # 说明：原 curl -s https://codecov.io/bash | bash 为已退役的上传器（2023 安全事件后
      # 官方下线），且属 curl|bash 反模式——改为官方 codecov-action（未配 token 时整步跳过）
      - name: Upload coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
  security:
    name: Security (govulncheck + gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec（对应 Go→Gosec）
        uses: securego/gosec@v2.21.4  # 钉死版本（原 @master 浮动引用，与自身 SHA-pin 标准不一致）
        with:
          args: -severity medium -quiet ./...
