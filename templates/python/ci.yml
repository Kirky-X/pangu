# Python CI 质量门禁：ruff(format/lint) / mypy / pytest+cov(阈值占位符) / bandit / pip-audit
name: CI

on:
  push:
    branches: [__PANGU_BRANCH__]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff format + ruff check + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src

  test:
    name: pytest + coverage (global ≥ + diff ≥)
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # fetch-depth: 0 供 diff-cover 对比基线分支计算变更行覆盖率。
      # 代价：全历史 checkout，超大仓库可达分钟级；fork PR 会把全量历史拉进 runner——
      # 历史若误提交过敏感文件请先清洗（或改用仅取基线分支的浅 fetch 定制）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      # coverage.xml 由 pyproject [tool.pytest.ini_options] addopts 的 --cov-report=xml:coverage.xml 产出
      - run: uv run pytest --cov --cov-fail-under=__PANGU_COV__
      # diff coverage：只对相对基线分支新增/修改的行设阈值（SKILL.md 核心原则 4 的落地）
      - name: Diff coverage (changed lines ≥ __PANGU_COV__%)
        env:
          # env 间接传递：${{ }} 直接插值进 run: 是 Actions 脚本注入面（分支名可含 shell 元字符）
          BASE_BRANCH: ${{ github.base_ref || '__PANGU_BRANCH__' }}
        run: |
          uvx diff-cover coverage.xml --fail-under __PANGU_COV__ \
            --compare-branch "origin/${BASE_BRANCH}"
      - name: Upload to Codecov (可选)
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-extras --dev
      - run: uv run bandit -c pyproject.toml -r src
      - run: uv run pip-audit
