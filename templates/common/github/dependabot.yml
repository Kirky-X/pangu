# Dependabot 依赖更新（GitHub 原生）。
# 通用部分：仅监控 GitHub Actions 版本（所有项目都有 CI）。
# 语言生态依赖（cargo/pip/npm/maven/go/composer/nuget）请按需在下面取消注释。
#
# 2026-11-16 家族决策：patch 级版本更新不再自动开 PR（每条 updates 配 ignore）。
# 注意官方语义：ignore 同时作用于安全更新——patch 级安全修复也不再自动开 PR，
# 安全漏洞兜底改由 Security 页告警 + CI 的 audit/deny 门禁承担。
# cooldown（冷却 7 天）过滤新发布即推的更新，减少 churn。
version: 2
updates:
  # 1) GitHub Actions 版本（通用，所有语言都适用）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    # patch 级版本更新关闭自动 PR（2026-11-16）
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  # 2) 语言生态依赖 — 按项目实际使用取消注释（仅保留对应一行）:
  # Rust:       package-ecosystem: cargo        directory: /
  # Python:     package-ecosystem: pip          directory: /
  # Node:       package-ecosystem: npm          directory: /
  # Java:       package-ecosystem: maven        directory: /
  # Go:         package-ecosystem: gomod        directory: /
  # Ruby:       package-ecosystem: bundler      directory: /
  # PHP:        package-ecosystem: composer     directory: /
  # .NET:       package-ecosystem: nuget        directory: /
  #
  # 示例（Rust，家族基线完整形态——cooldown/分组/提交前缀/patch-ignore）:
