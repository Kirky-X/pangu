name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # 前置校验两段式：tag 打错或版本不一致在这里失败，不进入构建与发布
  verify:
    name: Verify tag ↔ gemspec version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # 正则不含 build metadata（v1.2.3+build.5 拒绝）——9 语言模板同一约定，改需同步
      - name: Tag format (v<semver>)
        run: |
          echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::tag 须形如 v1.2.3 或 v1.2.3-rc.1，实际: ${GITHUB_REF_NAME}"; exit 1; }
      - name: Version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GEMSPEC="$(ls *.gemspec 2>/dev/null | head -1)"
          [ -n "$GEMSPEC" ] || { echo "::error::未找到 gemspec"; exit 1; }
          MANIFEST_VERSION="$(ruby -e 'print Gem::Specification.load(ARGV[0]).version.to_s' "$GEMSPEC")"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 ${GEMSPEC} version ${MANIFEST_VERSION} 不一致——先 bump 版本再打 tag"
            exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} ↔ ${GEMSPEC} ${MANIFEST_VERSION}"

  build:
    name: Build gem
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake build
      - uses: actions/upload-artifact@v4
        with:
          name: gem
          path: pkg/*.gem
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: gem, path: pkg }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pkg/*.gem
  publish-rubygems:
    # 配置 RUBYGEMS_API_KEY 后自动发布；否则跳过。
    name: Publish to RubyGems
    needs: build
    runs-on: ubuntu-latest
    env:
      GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
    if: ${{ env.GEM_HOST_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rake build
      - name: Push gem
        run: gem push pkg/*.gem
