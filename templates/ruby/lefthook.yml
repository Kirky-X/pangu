# lefthook 配置。启用: brew install lefthook && lefthook install
# 与 .pre-commit-config.yaml 功能等价（含 pre-push 慢检查），二选一即可。
# 工具缺失时的处置见 SKILL.md「常见失败处置」表（注释对应 hook，CI 兜底）。
# 已知限制：diff-cover 不支持 simplecov 默认输出（见 references/coverage-standards.md），pre-push 仅全局门禁。
pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.rb"
      run: bundle exec rubocop
    brakeman:
      run: "bundle exec brakeman --no-exit-on-warn 2>/dev/null || true"
    bundle-audit:
      run: "bundle exec bundle-audit check 2>/dev/null || true"
    no-private-key:
      run: "! git diff --cached --name-only -z | xargs -0 -r grep -IlE 'BEGIN ((RSA|DSA|EC|OPENSSH|PGP) )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'test "$(grep -cE ''^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'' "$1")" = 1'

pre-push:
  commands:
    coverage:
      name: coverage ≥__PANGU_COV__% (simplecov 全局)
      run: |
        bundle exec rspec
        cov=$(ruby -rjson -e '
          f = "coverage/.last_run.json"
          if File.exist?(f)
            d = JSON.parse(File.read(f))
            pct = d.dig("result","covered_percent") || d.dig("result","line") || 0
            print pct.to_f
          else
            print 0
          end
        ' 2>/dev/null || echo 0)
        awk -v c="$cov" 'BEGIN{exit !(c+0 < __PANGU_COV__)}' && { echo "coverage ${cov}% < __PANGU_COV__%"; exit 1; }
