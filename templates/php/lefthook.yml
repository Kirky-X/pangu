# lefthook 配置。启用: brew install lefthook && lefthook install
# 与 .pre-commit-config.yaml 功能等价（含 pre-push 慢检查），二选一即可。
# diff coverage 依赖 uvx（uv 自带）：未装 uv 可 pip install diff-cover 后把 uvx diff-cover 改为 diff-cover。
# 工具缺失时的处置见 SKILL.md「常见失败处置」表（注释对应 hook，CI 兜底）。
pre-commit:
  parallel: true
  commands:
    php-cs-fixer:
      glob: "*.php"
      run: php-cs-fixer fix --dry-run --using-cache=no --diff
    psalm:
      glob: "*.php"
      run: vendor/bin/psalm --no-cache
    composer-audit:
      run: composer audit
    no-private-key:
      run: "! git diff --cached --name-only -z | xargs -0 -r grep -IlE 'BEGIN ((RSA|DSA|EC|OPENSSH|PGP) )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'test "$(grep -cE ''^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?: .+'' "$1")" = 1'

pre-push:
  commands:
    coverage:
      name: coverage ≥__PANGU_COV__% (global + diff)
      run: |
        vendor/bin/phpunit --coverage-clover coverage.xml
        php -r '
          $c = simplexml_load_file("coverage.xml");
          $m = $c->project->metrics;
          $total = (int) $m["statements"];
          $covered = (int) $m["coveredstatements"];
          if ($total === 0) { echo "No statements\n"; exit(1); }
          exit($covered / $total * 100 >= __PANGU_COV__.0 ? 0 : 1);
        '
        uvx diff-cover coverage.xml --fail-under __PANGU_COV__ --compare-branch "origin/__PANGU_BRANCH__"
