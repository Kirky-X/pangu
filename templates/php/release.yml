name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # 前置校验两段式：composer.json 无 version 字段（版本由 Packagist 读 tag），这里校验 tag 规范
  verify:
    name: Verify tag format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 正则不含 build metadata（v1.2.3+build.5 拒绝）——9 语言模板同一约定，改需同步
      - name: Tag format (v<semver>)
        run: |
          echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::tag 须形如 v1.2.3 或 v1.2.3-rc.1，实际: ${GITHUB_REF_NAME}"; exit 1; }

  build:
    name: Build dist archive
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - name: Stage release archive
        run: |
          mkdir -p staging
          name="${GITHUB_REPOSITORY##*/}-${GITHUB_REF_NAME#v}"
          tar -czf "staging/${name}.tar.gz" \
            --exclude=staging --exclude=.git --exclude=tests --exclude=.github .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: staging
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: staging }
      - name: Generate checksums.txt（下载侧可校验完整性）
        run: |
          cd staging
          find . -type f ! -name 'checksums.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: staging/*
  # Packagist 通过 git tag webhook 自动同步，无需 push key。
  # 如需手动触发更新，参考 references/registry-secrets.md。
