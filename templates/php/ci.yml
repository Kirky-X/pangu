name: CI
on:
  push:
    branches: [__PANGU_BRANCH__]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-php-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality (php-cs-fixer + Psalm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: xdebug
          tools: composer, php-cs-fixer
      # composer 依赖缓存：lock 未变时直接命中（无 lock 时 restore-keys 回退最近缓存）
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist
      - name: php-cs-fixer
        run: php-cs-fixer fix --dry-run --using-cache=no --diff
      - name: Psalm（含安全审查，对应 PHP→Psalm）
        run: vendor/bin/psalm --no-cache --stats
        continue-on-error: true  # 显式 advisory：不阻断，但结果可见（不再用 || true 掩盖）
  test:
    name: Test + Coverage (global + diff ≥)
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # fetch-depth: 0 供 diff-cover 对比基线分支计算变更行覆盖率。
      # 代价：全历史 checkout，超大仓库可达分钟级；fork PR 会把全量历史拉进 runner——
      # 历史若误提交过敏感文件请先清洗（或改用仅取基线分支的浅 fetch 定制）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: xdebug
          tools: composer
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist
      - name: PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml
      - name: Enforce global line coverage
        run: |
          php -r '
            $c = simplexml_load_file("coverage.xml");
            $m = $c->project->metrics;
            $total = (int) $m["statements"];
            $covered = (int) $m["coveredstatements"];
            if ($total === 0) { echo "No statements\n"; exit(1); }
            $pct = $covered / $total * 100;
            printf("Line coverage: %.2f%% (%d/%d)\n", $pct, $covered, $total);
            exit($pct >= __PANGU_COV__.0 ? 0 : 1);
          '
      # diff coverage：clover 格式为 diff-cover 原生支持，只对相对基线分支新增/修改的行设阈值
      # uvx 跑 diff-cover（setup-uv 自带缓存，避免 pipx 每次 CI 冷安装）
      - uses: astral-sh/setup-uv@v4
      - name: Diff coverage (changed lines ≥ __PANGU_COV__%)
        env:
          # env 间接传递：${{ }} 直接插值进 run: 是 Actions 脚本注入面（分支名可含 shell 元字符）
          BASE_BRANCH: ${{ github.base_ref || '__PANGU_BRANCH__' }}
        run: |
          uvx diff-cover coverage.xml --fail-under __PANGU_COV__ \
            --compare-branch "origin/${BASE_BRANCH}"
      - name: Upload coverage
        # 已退役的 curl|bash uploader（2023 安全事件后官方下线），改官方 codecov-action
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
  security:
    name: Security (composer audit + Psalm taint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist
      - name: composer audit（依赖 CVE）
        run: composer audit
      - name: Psalm taint analysis（污点分析）
        run: vendor/bin/psalm --taint-analysis --no-cache
        continue-on-error: true  # 显式 advisory（同上）
