# Rust Release：tag (v*) 触发 → 两段式校验 → 构建 → GitHub Release → 条件发布 crates.io
# 家族终态 2026-11-17 蒸馏（confers 基线 + pangu 两段式 verify）：
#   - rc 预发布派生：semver 预发布段（-rc.N）自动标 GitHub prerelease，不抢占 Latest
#   - 幂等三元组：tag 级并发组 + Release 唯一性断言 + 已发布跳过
#   - crates.io trusted publishing（OIDC）：短时凭证，长生命周期令牌退役；
#     前提 = 在 crates.io 上把仓库注册为该 crate 的 trusted publisher
#     （步骤见 references/registry-secrets.md）；未注册时改用下方注释的 token 条件路径
# 纯库 crate 可裁剪 build/package 作业（参考 confers：Release 只带源码压缩包）
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # 创建 GitHub Release

concurrency:
  # tag 级并发组：同 tag 重跑互斥，防止 Release 重复对象（幂等三元组之一）
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # 两段式前置校验：tag 打错或版本不一致在这里失败，不进入构建与发布
  verify:
    name: Verify tag ↔ Cargo.toml version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # 正则不含 build metadata（v1.2.3+build.5 拒绝）——9 语言模板同一约定，改需同步
      - name: Tag format (v<semver>)
        run: |
          echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::tag 须形如 v1.2.3 或 v1.2.3-rc.1，实际: ${GITHUB_REF_NAME}"; exit 1; }
      - name: Version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 Cargo.toml version ${MANIFEST_VERSION} 不一致——先 bump 版本再打 tag"
            exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} ↔ Cargo.toml ${MANIFEST_VERSION}"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          STAGE=target/release-stage
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ github.event.repository.name }}" "$STAGE/" 2>/dev/null || true
          cp README.md LICENSE* "$STAGE/" 2>/dev/null || true
          tar czf "${{ github.event.repository.name }}-${{ matrix.target }}.tar.gz" -C "$STAGE" .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          STAGE=target/release-stage
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ github.event.repository.name }}.exe" "$STAGE/" 2>/dev/null || true
          cp README.md LICENSE* "$STAGE/" 2>/dev/null || true
          7z a "${{ github.event.repository.name }}-${{ matrix.target }}.zip" "$STAGE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate checksums.txt（下载侧可校验完整性；产物签名/出处证明见 references/registry-secrets.md）
        run: |
          cd artifacts
          find . -type f ! -name 'checksums.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      # semver 预发布段（-rc.N 等）→ GitHub prerelease 标记；rc 不得抢占 Latest
      - name: Derive prerelease flag
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
          else
            echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Release with artifacts
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.PRERELEASE }}
          files: artifacts/**/*
      - name: Verify release uniqueness (idempotency guard)
        run: |
          TAG="${GITHUB_REF_NAME}"
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq "[.[] | select(.tag_name == \"${TAG}\")] | length")
          echo "release objects for ${TAG}: ${COUNT}"
          if [ "${COUNT}" != "1" ]; then
            echo "::error::expected exactly 1 release for ${TAG}, found ${COUNT}; release state is not idempotent"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # crates.io trusted publishing（OIDC，家族终态）：id-token: write 必需，
  # auth-action 以 Actions OIDC 换取短时凭证。前提：crates.io 已注册 trusted publisher。
  # 未注册时的 token 条件路径（无 secret 自动跳过，不报错）见本 job 末尾注释块。
  publish-crates:
    name: Publish to crates.io (OIDC)
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Skip if already on crates.io (idempotent)
        id: published
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/${{ github.event.repository.name }}/${{ steps.ver.outputs.version }}")
          echo "crates.io responded $CODE for ${{ github.event.repository.name }} ${{ steps.ver.outputs.version }}"
          echo "exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: cargo publish
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
        # 本地/重跑路径已发布时撞车属幂等成功，不阻断 Release 交付
        continue-on-error: true

  # ── 备选：CARGO_REGISTRY_TOKEN 条件路径（未注册 trusted publishing 时启用本块、
  #    停用上方 OIDC job）——仅当 secret 存在才发布，无 secret 跳过不报错 ──
  # publish-crates:
  #   name: Publish to crates.io (条件)
  #   needs: github-release
  #   runs-on: ubuntu-latest
  #   env:
  #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  #   if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
  #     - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
  #       with:
  #         toolchain: 1.97.1
  #     - name: cargo publish
  #       run: cargo publish --locked --token "${CARGO_REGISTRY_TOKEN}"
