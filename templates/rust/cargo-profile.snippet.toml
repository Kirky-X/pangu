# pangu: release 编译优化片段（由 init-rust.sh 自动追加到 Cargo.toml 末尾，追加后删除本文件）。
# 社区 release 标配：减体积 + 提速 + 可复现构建。
# 取舍说明见 references/build-optimization.md。
# 注意：strip = "symbols" 在 macOS 上行为与 Linux 略有差异（macOS strip 不支持所有 GNU strip 选项），
#       但 cargo 内部处理了平台差异，通常无需额外配置。
[profile.release]
lto = "thin"           # 链接时优化：体积 -15% / 速度 +10-25%（thin 比 fat 编译快很多，收益接近）
codegen-units = 1      # 单代码生成单元：最优代码生成（牺牲约 30% 编译时间换运行性能）
strip = "symbols"      # 去 symbol table：二进制体积 -30%（cargo 内部处理跨平台差异）
panic = "abort"        # 不展开：体积 -10% + 提速。⚠️ library 项目删此行（依赖它的 binary 将无法 catch panic 续跑）
