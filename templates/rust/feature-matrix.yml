# feature 组合矩阵（Rust 专属，需要仓库存在实际 feature 组合面）。
# 每周定时 + 手动触发：PR 每次全量跑成本过高，PR 门禁由 ci.yml 既有矩阵兜底。
# 刻意只做 each-feature（单开）：powerset depth-2 为 C(n,2) 量级（数百至上千次
# check），成本/收益为负；两两组合面由 ci.yml 组合矩阵与 compile_error 守卫覆盖。
# 仓库无多 feature 面时删除本文件。依赖 protoc 等系统件的 feature 在此追加安装步。
name: feature-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "47 5 * * 1"

permissions:
  contents: read

concurrency:
  group: feature-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  each-feature:
    name: cargo hack --each-feature
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-hack
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-hack
      - name: Check each feature alone
        run: cargo hack check --each-feature
