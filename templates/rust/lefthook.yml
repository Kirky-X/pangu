# lefthook 配置。启用: brew install lefthook && lefthook install
# 与 .pre-commit-config.yaml 功能等价（含 pre-push 慢检查），二选一即可。
# diff coverage 依赖 uvx（uv 自带）：未装 uv 可 pip install diff-cover 后把 uvx diff-cover 改为 diff-cover。
# 工具缺失时的处置见 SKILL.md「常见失败处置」表（注释对应 hook，CI 兜底）。
pre-commit:
  parallel: true
  commands:
    rustfmt-check:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
    cargo-deny:
      run: cargo deny check
    no-private-key:
      run: "! git diff --cached --name-only -z | xargs -0 -r grep -IlE 'BEGIN ((RSA|DSA|EC|OPENSSH|PGP) )?PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'grep -qE "^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert|style)(\(.+\))?!?: .+" {1}'

pre-push:
  commands:
    cargo-audit:
      run: cargo audit
    coverage:
      name: coverage ≥__PANGU_COV__% (global + diff)
      run: |
        cargo llvm-cov --all-features --fail-under-lines __PANGU_COV__ --lcov --output-path lcov.info
        uvx diff-cover lcov.info --fail-under __PANGU_COV__ --compare-branch "origin/__PANGU_BRANCH__"
