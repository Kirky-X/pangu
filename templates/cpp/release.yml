name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  # 前置校验两段式：tag 打错或版本不一致在这里失败，不进入构建与发布
  verify:
    name: Verify tag ↔ CMakeLists version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # 正则不含 build metadata（v1.2.3+build.5 拒绝）——9 语言模板同一约定，改需同步
      - name: Tag format (v<semver>)
        run: |
          echo "${GITHUB_REF_NAME}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::tag 须形如 v1.2.3 或 v1.2.3-rc.1，实际: ${GITHUB_REF_NAME}"; exit 1; }
      - name: Version consistency
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # project(<name> VERSION <x.y.z> LANGUAGES ...) 的版本段
          MANIFEST_VERSION="$(sed -n 's/^project([^)]*VERSION \([0-9][^ )]*\).*/\1/ip' CMakeLists.txt | head -1)"
          if [ -z "$MANIFEST_VERSION" ]; then
            echo "::notice::CMakeLists.txt project() 未声明 VERSION，跳过一致性检查"
          elif [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 CMakeLists project(VERSION ${MANIFEST_VERSION}) 不一致——先 bump 版本再打 tag"
            exit 1
          else
            echo "OK: tag ${GITHUB_REF_NAME} ↔ CMakeLists ${MANIFEST_VERSION}"
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest, stage: app-linux }
          - { os: macos, runner: macos-latest, stage: app-macos }
          - { os: windows, runner: windows-latest, stage: app-windows.exe }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p staging
          bin="${{ matrix.stage }}"
          found=""
          for p in build/app build/Release/app.exe build/Release/app build/app.exe; do
            [ -f "$p" ] && { cp "$p" "staging/$bin"; found=1; break; }
          done
          [ -n "$found" ] || { echo "binary not found, packing build dir"; tar -czf "staging/build-${bin}.tgz" build; }
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}
          path: staging
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: artifact-*
          merge-multiple: true
      - name: Generate checksums.txt（下载侧可校验完整性；产物签名/出处证明见 references/registry-secrets.md）
        run: |
          cd staging
          find . -type f ! -name 'checksums.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: staging/*
